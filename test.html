    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        // Your original Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDUDBMlQIsRehOQFRqyoAKlWElWjox4ZOo",
            authDomain: "the-impossibles-sign-up.firebaseapp.com",
            databaseURL: "https://the-impossibles-sign-up-default-rtdb.firebaseio.com",
            projectId: "the-impossibles-sign-up",
            storageBucket: "the-impossibles-sign-up.firebasestorage.app",
            messagingSenderId: "1060998426448",
            appId: "1:1060998426448:web:d6e8da85edbc9cb6fa8655"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. POPULATE LEADERBOARD IN REAL-TIME
        const listEl = document.getElementById('leaderboard-list');
        onValue(ref(db, 'locations'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                // Sort by votes descending and grab Top 10
                const sortedLocations = Object.values(data)
                    .sort((a, b) => b.votes - a.votes)
                    .slice(0, 10);
                
                listEl.innerHTML = ''; 
                
                if (sortedLocations.length === 0) {
                    listEl.innerHTML = '<li class="leaderboard-item" style="justify-content: center; border: none;">No votes yet! Be the first.</li>';
                    return;
                }

                sortedLocations.forEach((loc, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `
                        <span class="leaderboard-rank">#${index + 1}</span>
                        <span class="leaderboard-city">${loc.city}, ${loc.state}</span>
                        <span class="leaderboard-votes">${loc.votes}</span>
                    `;
                    listEl.appendChild(li);
                });
            } else {
                listEl.innerHTML = '<li class="leaderboard-item" style="justify-content: center; border: none;">No votes yet! Be the first.</li>';
            }
        });

        // 2. INVISIBLE FORM INTERCEPTION
        document.addEventListener('click', async (e) => {
            const submitBtn = e.target.closest('button[type="submit"], input[type="submit"]'); 
            
            if (submitBtn && submitBtn.closest('.sender-form-field')) {
                const form = submitBtn.closest('form');
                if (!form) return;
                
                let city = '', state = '';
                
                form.querySelectorAll('input').forEach(input => {
                    const attrStr = `${input.name} ${input.placeholder} ${input.className}`.toLowerCase();
                    if (attrStr.includes('city')) city = input.value;
                    if (attrStr.includes('state')) state = input.value;
                });

                if (!city || !state) {
                    form.querySelectorAll('label').forEach(label => {
                        const text = label.innerText.toLowerCase();
                        const inputId = label.getAttribute('for');
                        const input = inputId ? document.getElementById(inputId) : label.querySelector('input');
                        if (input) {
                            if (text.includes('city')) city = input.value;
                            if (text.includes('state')) state = input.value;
                        }
                    });
                }

                if (city && state) {
                    const cleanCity = city.trim();
                    const cleanState = state.trim().toUpperCase();
                    const locationId = `${cleanCity.toLowerCase().replace(/[^a-z]/g, '')}_${cleanState.toLowerCase().replace(/[^a-z]/g, '')}`;
                    
                    try {
                        const locRef = ref(db, `locations/${locationId}`);
                        const snap = await get(locRef);
                        
                        if (snap.exists()) { 
                            await update(ref(db, 'locations'), { [`${locationId}/votes`]: increment(1) }); 
                        } else { 
                            await set(locRef, { 
                                city: cleanCity, 
                                state: cleanState, 
                                votes: 1 
                            }); 
                        }
                    } catch (err) {
                        console.error("Firebase update failed", err);
                    }
                }
            }
        }, true); 
    </script>
