<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, we’re the Impossibles from Austin, Texas!</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        body {
            background-image: url('THEIMPOSSIBLES_Midwest2026_REGGIES_BG.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; overflow-x: hidden;
        }

        /* --- FANCY PREMIUM LOADING ANIMATIONS --- */
        .animate-on-load {
            opacity: 0; transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hero-logo-container { width: 100%; max-width: 1000px; margin-bottom: 30px; text-align: center; }
        .full-width-logo { width: 100%; height: auto; max-height: 300px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }

        /* BUTTONS (Media Links at Bottom) */
        .link-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 850px; margin: 0 auto 40px auto; }
        
        .link-button {
            background-color: #000033; color: #FFFFFF; border: 2px solid #FFFFFF; border-radius: 40px;
            padding: 6px 20px 6px 8px; text-decoration: none; text-transform: uppercase;
            font-weight: 900; font-size: 16px; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: flex-start; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        
        .status-bubble {
            background-color: #FFFFFF; color: #000033; padding: 8px 18px; border-radius: 25px;
            font-size: 12px; font-weight: 900; margin-right: 15px; min-width: 70px; text-align: center;
            position: relative; z-index: 2;
        }
        
        .link-button:hover { background-color: #1a1a4d; transform: scale(1.02); }

        .link-button::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: sweepSheen 6s infinite; pointer-events: none; z-index: 1;
        }

        .link-button:nth-child(1)::after { animation-delay: 0s; }
        .link-button:nth-child(2)::after { animation-delay: 0.5s; }
        .link-button:nth-child(3)::after { animation-delay: 1.0s; }

        @keyframes sweepSheen {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .link-button.jackpot-pulse { animation: jackpotGlitch 0.6s ease-out forwards; }
        @keyframes jackpotGlitch {
            0% { border-color: #FFFFFF; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transform: scale(1); }
            15% { border-color: #7ca6ff; box-shadow: 0 0 20px #7ca6ff, inset 0 0 10px #7ca6ff; transform: scale(1.03); }
            100% { border-color: #FFFFFF; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transform: scale(1); }
        }

        @media (max-width: 700px) { .link-grid { grid-template-columns: 1fr; } }

        /* --- TYPOGRAPHY & TITLE LOCKUPS --- */
        .xl-heading { 
            color: #FFFFFF; font-family: 'Impact', 'Arial Black', sans-serif; 
            text-transform: uppercase; text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .leaderboard-title-lockup, .signup-title-lockup {
            display: flex; flex-direction: column; 
            width: 100%; max-width: 380px; 
            margin: 0 auto 15px auto; 
        }

        .leaderboard-h1 {
            font-size: clamp(26px, 8.5vw, 36px); 
            margin: 0; text-align: center; white-space: nowrap; letter-spacing: 0px;
        }

        .leaderboard-sub-chars {
            color: #FFFFFF; font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(10px, 3.5vw, 15px);
            text-transform: uppercase; margin: 4px 0 0 0;
            text-align: center; white-space: nowrap;
            letter-spacing: clamp(2px, 1vw, 4.5px);
            margin-right: calc(-1 * clamp(2px, 1vw, 4.5px)); 
        }

        .signup-h1 {
            font-size: clamp(52px, 16vw, 84px); 
            margin: 0; text-align: center; line-height: 0.9;
            white-space: nowrap; letter-spacing: 2px;
        }

        .signup-sub-chars {
            color: #FFFFFF; font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(12px, 4vw, 17px);
            text-transform: uppercase; margin: 4px 0 0 0;
            text-align: center; white-space: nowrap;
            letter-spacing: clamp(2px, 1.2vw, 5.5px);
            margin-right: calc(-1 * clamp(2px, 1.2vw, 5.5px)); 
        }

        /* SCROLLING INFINITE MAP TRACK */
        .impossibles-map-wrapper { 
            position: relative; width: 100%; max-width: 1000px; 
            margin-top: -10px; margin-bottom: 20px; overflow: hidden; 
        }
        .map-pan-track { display: flex; flex-direction: row; width: 100%; will-change: transform; padding: 40px 0; }
        .map-instance { width: 100%; flex-shrink: 0; position: relative; aspect-ratio: 975 / 610; }
        #map-clone { display: none; } 

        @media (max-width: 700px) {
            .impossibles-map-wrapper { width: 100vw; margin-left: calc(-50vw + 50%); }
            .map-pan-track { width: 500vw; touch-action: pan-y; } 
            .map-instance { width: 250vw; }
            #map-clone { display: block; }
        }

        .map-instance svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .state-path { fill: #111122; stroke: #333355; stroke-width: 1px; }
        .tour-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }

        /* TOUR PINS (ACTIVE VS PLAYED) */
        .tour-pin-wrapper { position: absolute; width: 0; height: 0; pointer-events: none; }
        
        /* PLAYED SHOWS: GREYED OUT, 66% SCALE WITH HOVER HIGHLIGHT */
        .tour-pin-wrapper.played {
            transform: scale(0.66);
            filter: grayscale(100%) opacity(0.55);
            z-index: 10;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .tour-pin-wrapper.played:hover {
            transform: scale(0.9);
            filter: grayscale(0%) opacity(1);
            z-index: 25;
        }

        .tour-pin-wrapper.active {
            z-index: 30;
        }

        .tour-pin {
            position: absolute; 
            background-color: #000033;
            color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif; padding: 8px 14px;
            border: 2px solid #ffffff; box-shadow: 0 0 20px rgba(255, 0, 85, 0.8), 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 8px; text-align: center;
            white-space: nowrap; pointer-events: auto; cursor: default; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center;
            z-index: 20;
        }
        
        .tour-pin-wrapper.active .tour-pin {
            background-color: #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.9), 0 4px 12px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        /* --- SIGN OFFSET TRANSFORMATIONS --- */
        /* DFW: Offset Top-Left */
        .tour-pin-wrapper.pin-dfw .tour-pin {
            transform: translate(-100%, -120%);
        }

        /* AUSTIN: Offset Bottom-Right */
        .tour-pin-wrapper.pin-austin .tour-pin {
            transform: translate(20%, 20%);
        }

        /* GAINESVILLE & PLAYED SHOWS: Centered Above Post */
        .tour-pin-wrapper.pin-fest .tour-pin,
        .tour-pin-wrapper.played .tour-pin {
            transform: translate(-50%, -100%);
            margin-top: -30px; /* Space for the 30px vector post stem */
        }

        /* SVG CONNECTING LINE LAYER */
        .pin-line-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        .pin-line-svg line {
            stroke: #ffffff;
            stroke-width: 3px;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
        }

        .tour-pin:hover {
            background-color: #ffffff; color: #000033;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
        }
        
        /* UNIFORM HIERARCHY: DATE (TOP), CITY (MIDDLE), TICKETS (BOTTOM) */
        .tour-pin-date { 
            font-size: clamp(11px, 2.5vw, 13px); 
            letter-spacing: 1px; 
            line-height: 1.1; 
            opacity: 0.95; 
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        
        .tour-pin-city { 
            font-size: clamp(14px, 3.5vw, 18px); 
            line-height: 1.1; 
            margin-bottom: 4px; 
            text-transform: uppercase; 
        }

        .tour-pin-tix {
            font-size: clamp(10px, 2.5vw, 12px); 
            background: #ffffff; 
            color: #d97706;
            border-radius: 4px; 
            padding: 2px 8px; 
            display: inline-block; 
            letter-spacing: 1px;
            font-weight: bold;
        }
        .tour-pin:hover .tour-pin-tix { background: #000033; color: #ffffff; }

        /* --- THE JACKPOT OVERLAY ANIMATION --- */
        #jackpot-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10000; }
        .anim-bubble {
            position: absolute; width: 220px; height: 220px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 100px rgba(255,255,255,0.5); font-weight: 900;
            transform: translate(-50%, -50%) scale(0); opacity: 0;
            border-style: solid; transition: all 0.8s ease-in-out; 
            will-change: top, left, width, height, background-color, transform;
        }
        .anim-bubble.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .anim-bubble .v-big { font-size: 64px; transition: font-size 0.8s ease-in-out; }
        .anim-bubble .c-big { font-size: 18px; text-transform: uppercase; margin-top: -10px; transition: all 0.8s ease-in-out; }

        /* LEADERBOARD WRAPPER */
        .leaderboard-wrapper {
            width: 100%; max-width: 600px; background-color: rgba(0, 0, 51, 0.85);
            border: 2px solid #FFFFFF; border-radius: 15px; padding: 25px;
            margin-bottom: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            box-sizing: border-box; position: relative; overflow: hidden; 
        }
        .leaderboard-wrapper::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: sweepSheen 8s infinite 1s; pointer-events: none; z-index: 10;
        }
        .leaderboard-subtitle { color: #7ca6ff; font-size: 14px; text-align: center; text-transform: uppercase; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; }
        .leaderboard-list { list-style: none; padding: 0; margin: 0; position: relative; z-index: 2; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.2); color: #FFFFFF; font-weight: bold; font-size: 16px; text-transform: uppercase; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { 0% { opacity: 0; background-color: rgba(124, 166, 255, 0.3); } 100% { opacity: 1; background-color: transparent; } }
        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-rank { width: 30px; color: #7ca6ff; }
        .leaderboard-city { flex-grow: 1; text-align: left; }
        .leaderboard-votes { background-color: #FFFFFF; color: #000033; padding: 4px 12px; border-radius: 15px; font-size: 14px; font-weight: 900; }

        /* FORM */
        .xl-heading-container { width: 100%; max-width: 600px; margin-bottom: 50px; padding: 0; }
        .impossibles-form-wrapper { width: 100%; max-width: 600px; margin: 0 auto; margin-bottom: 40px;}
        .impossibles-grid { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 30px; }
        .impossibles-half { flex: 1; min-width: 250px; }
        .field-container { position: relative; margin-top: 20px; }
        .impossibles-input { width: 100%; padding: 10px 0; background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.5); color: #FFFFFF; font-size: 18px; }
        .impossibles-input:focus { outline: none; border-bottom: 2px solid #FFFFFF; }
        .impossibles-label { position: absolute; top: 10px; left: 0; color: rgba(255, 255, 255, 0.6); font-size: 12px; font-weight: bold; text-transform: uppercase; pointer-events: none; transition: 0.3s; }
        .impossibles-input:focus + .impossibles-label, .impossibles-input:not(:placeholder-shown) + .impossibles-label { top: -15px; font-size: 10px; color: #FFFFFF; }
        .impossibles-submit-btn { display: block; width: 40%; margin: 20px auto 0; padding: 15px; background-color: transparent; color: #FFFFFF; border: 2px solid #FFFFFF; border-radius: 40px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .impossibles-submit-btn:hover { background-color: #FFFFFF; color: #000033; }
        .impossibles-submit-btn.error { background-color: #ff3333; border-color: #ff3333; color: #FFFFFF; }

        .social-footer { display: flex; justify-content: center; gap: 25px; padding: 40px 0; width: 100%; }
        .social-icon { width: 30px; height: 30px; transition: opacity 0.2s ease; filter: brightness(0) invert(1); }
        .social-icon:hover { opacity: 0.7; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, update, increment } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUDBMlQIsRehOQFRqyoAKlWElWjox4ZOo",
            authDomain: "the-impossibles-sign-up.firebaseapp.com",
            databaseURL: "https://the-impossibles-sign-up-default-rtdb.firebaseio.com",
            projectId: "the-impossibles-sign-up",
            storageBucket: "the-impossibles-sign-up.firebasestorage.app",
            messagingSenderId: "1060998426448",
            appId: "1:1060998426448:web:d6e8da85edbc9cb6fa8655"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const width = 975, height = 610;
        const projection = d3.geoAlbersUsa().scale(1300).translate([width / 2, height / 2]);
        const path = d3.geoPath().projection(projection);
            
        let tourLayer;
        let pendingJackpotUpdate = { city: null, oldVotes: 0 }; 
        let currentClusters = [];

        let currentPan = 0, isDragging = false, startX = 0, isJackpotPlaying = false;
        let touchVelocity = 0, lastTouchX = 0, isInertia = false;
        const autoPanSpeed = 0.5;
        let isJackpotPanning = false, jackpotStartPan = 0, jackpotTargetPan = 0, jackpotPanStartTime = 0;

        function panLoop() {
            if (window.innerWidth <= 700) {
                if (isJackpotPanning) {
                    let elapsed = performance.now() - jackpotPanStartTime;
                    let progress = Math.min(elapsed / 800, 1);
                    let ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    currentPan = jackpotStartPan + (jackpotTargetPan - jackpotStartPan) * ease;
                    if (progress === 1) isJackpotPanning = false;
                } else if (isDragging) {
                } else if (isInertia && !isJackpotPlaying) {
                    currentPan += touchVelocity; touchVelocity *= 0.95; 
                    if (Math.abs(touchVelocity) < 0.2) isInertia = false;
                } else if (!isJackpotPlaying) {
                    currentPan -= autoPanSpeed; 
                }
                
                const track = document.getElementById('map-track');
                const instanceWidth = document.getElementById('dynamic-map').offsetWidth;

                if (currentPan <= -instanceWidth) {
                    currentPan += instanceWidth;
                    if (isJackpotPanning) { jackpotStartPan += instanceWidth; jackpotTargetPan += instanceWidth; }
                } else if (currentPan > 0) {
                    currentPan -= instanceWidth;
                    if (isJackpotPanning) { jackpotStartPan -= instanceWidth; jackpotTargetPan -= instanceWidth; }
                }
                
                track.style.transform = `translate3d(${currentPan}px, 0, 0)`;
            } else {
                document.getElementById('map-track').style.transform = `translate3d(0, 0, 0)`;
            }
            requestAnimationFrame(panLoop);
        }

        const track = document.getElementById('map-track');
        track.addEventListener('touchstart', (e) => {
            if (window.innerWidth > 700 || isJackpotPlaying) return;
            isDragging = true; isInertia = false; touchVelocity = 0; lastTouchX = e.touches[0].clientX; startX = e.touches[0].clientX - currentPan;
        });
        track.addEventListener('touchmove', (e) => {
            if (window.innerWidth > 700 || !isDragging || isJackpotPlaying) return;
            const currentTouchX = e.touches[0].clientX; touchVelocity = currentTouchX - lastTouchX; lastTouchX = currentTouchX; currentPan = currentTouchX - startX;
        }, { passive: true });
        track.addEventListener('touchend', () => { isDragging = false; if (Math.abs(touchVelocity) > 0.5) isInertia = true; });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function play8Bit(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if(type === 'spawn') {
                osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
            } else {
                osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.05);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(); osc.stop(now + 0.3);
            }
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // CONFIRMED SHOWS CONFIGURATION
        const confirmedShows = [
            // PLAYED SHOWS (Vertical line from bottom of sign to map coordinate)
            { date: "AUG 21", city: "St. Louis, MO", lng: -90.1994, lat: 38.6270, status: "played", lineType: "vertical" },
            { date: "AUG 22", city: "Chicago, IL", lng: -87.6298, lat: 41.8781, status: "played", lineType: "vertical" },
            { date: "AUG 23", city: "Detroit, MI", lng: -83.0458, lat: 42.3314, status: "played", lineType: "vertical" },
            { date: "SEP 12", city: "Supernova, VA", lng: -76.3094, lat: 37.0024, status: "played", lineType: "vertical" },
            
            // UPCOMING ACTIVE SHOWS
            { date: "OCT 23-25", city: "The Fest, FL", lng: -82.3248, lat: 29.6516, url: "https://thefestfl.com/ticket-info/", status: "active", id: "pin-fest", lineType: "vertical" },
            { date: "DEC 4", city: "DFW, TX", lng: -97.3308, lat: 32.7555, url: "https://wl.eventim.us/event/the-impossibles/706586?afflky=TulipsFTW", status: "active", id: "pin-dfw", lineType: "offset", lineStart: { x: -45, y: -45 } },
            { date: "DEC 5", city: "Austin, TX", lng: -97.7431, lat: 30.2672, url: "https://www.etix.com/ticket/p/42713410/the-impossibles-mohawk-20th-anniversary-austin-resound-presents", status: "active", id: "pin-austin", lineType: "offset", lineStart: { x: 35, y: 25 } }
        ];

        // SMART AUTO-CENTERING ON MOBILE BEFORE PANNING
        function centerUpcomingShowsOnMobile() {
            if (window.innerWidth > 700) return;
            
            const activeShows = confirmedShows.filter(s => s.status === 'active');
            if (activeShows.length === 0) return;

            let avgLng = 0, avgLat = 0;
            activeShows.forEach(s => { avgLng += s.lng; avgLat += s.lat; });
            avgLng /= activeShows.length;
            avgLat /= activeShows.length;

            const coords = projection([avgLng, avgLat]);
            if (coords) {
                const mapInner = document.getElementById('dynamic-map');
                const instanceWidth = mapInner.offsetWidth || (window.innerWidth * 2.5);
                const intrinsicX = (coords[0] / width) * instanceWidth;
                
                let targetPan = (window.innerWidth / 2) - intrinsicX;
                while (targetPan > 0) targetPan -= instanceWidth;
                while (targetPan <= -instanceWidth) targetPan += instanceWidth;
                
                currentPan = targetPan;
                const track = document.getElementById('map-track');
                if (track) {
                    track.style.transform = `translate3d(${currentPan}px, 0, 0)`;
                }
            }
        }

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(function(us) {
            const mapSvg = d3.select("#dynamic-map").append("svg").attr("viewBox", [0, 0, width, height]);
            mapSvg.append("g").selectAll("path").data(topojson.feature(us, us.objects.states).features).join("path").attr("class", "state-path").attr("d", path);
            
            // SVG Layer for Connecting Vector Lines
            const lineSvg = d3.select("#dynamic-map").append("svg")
                .attr("class", "pin-line-svg")
                .attr("viewBox", [0, 0, width, height]);

            // Reusable Arrowhead Marker Definition
            const defs = lineSvg.append("defs");
            defs.append("marker")
                .attr("id", "arrowhead")
                .attr("viewBox", "0 0 10 10")
                .attr("refX", 6)
                .attr("refY", 5)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto-start-reverse")
                .append("path")
                .attr("d", "M 0 1.5 L 10 5 L 0 8.5 z")
                .attr("fill", "#ffffff");

            tourLayer = d3.select("#dynamic-map").append("div").attr("class", "tour-layer");
            
            // Plot Tour Pins & Vector Lines
            confirmedShows.forEach(show => {
                const coords = projection([show.lng, show.lat]);
                if (coords) {
                    const extraClass = show.id ? show.id : '';
                    const pinWrapper = tourLayer.append("div")
                        .attr("class", `tour-pin-wrapper ${show.status} ${extraClass}`)
                        .style("left", `${(coords[0] / width) * 100}%`)
                        .style("top", `${(coords[1] / height) * 100}%`);
                        
                    const pin = pinWrapper.append("div")
                        .attr("class", "tour-pin");
                    
                    if (show.status === 'active') {
                        pin.on("click", () => window.open(show.url, '_blank'));
                        
                        // STRICT HIERARCHY: 1. DATE (Top), 2. CITY (Middle), 3. TICKETS (Bottom)
                        pin.append("div").attr("class", "tour-pin-date").text(show.date);
                        pin.append("div").attr("class", "tour-pin-city").text(show.city.split(',')[0]);
                        pin.append("div").attr("class", "tour-pin-tix").text("TICKETS");
                    } else {
                        // INACTIVE SHOWS: DISPLAY CITY ONLY
                        pin.append("div").attr("class", "tour-pin-city").text(show.city.split(',')[0]);
                    }

                    // DRAW CONNECTING LINES
                    if (show.lineType === "vertical") {
                        // Vertical post drawing from bottom edge of sign down to map point
                        lineSvg.append("line")
                            .attr("x1", coords[0])
                            .attr("y1", coords[1] - 30) // Starts at bottom edge of sign box
                            .attr("x2", coords[0])
                            .attr("y2", coords[1])       // Ends at map coordinate
                            .attr("marker-end", "url(#arrowhead)");
                    } else if (show.lineType === "offset" && show.lineStart) {
                        // Angled line connecting offset sign box corner to map coordinate
                        lineSvg.append("line")
                            .attr("x1", coords[0] + show.lineStart.x)
                            .attr("y1", coords[1] + show.lineStart.y)
                            .attr("x2", coords[0])
                            .attr("y2", coords[1])
                            .attr("marker-end", "url(#arrowhead)");
                    }
                }
            });

            // Initial center alignment before launching pan loop
            centerUpcomingShowsOnMobile();
            panLoop();

            const cloneObserver = new MutationObserver(() => {
                if (window.innerWidth <= 700) { document.getElementById('map-clone').innerHTML = document.getElementById('dynamic-map').innerHTML; }
            });
            cloneObserver.observe(document.getElementById('dynamic-map'), { childList: true, subtree: true, attributes: true });
            
            listenToDatabase();
        });

        // 1. DATABASE LISTENER (Leaderboard Engine)
        function listenToDatabase() {
            onValue(ref(db, 'locations'), (snapshot) => {
                const data = snapshot.val(); if (!data) return;
                
                const rawLocations = Object.values(data).sort((a, b) => b.votes - a.votes);
                const clusters = [];

                rawLocations.forEach(loc => {
                    let added = false;
                    for (let cluster of clusters) {
                        if (getDistance(loc.lat, loc.lng, cluster.lat, cluster.lng) <= 115) {
                            cluster.votes += loc.votes;
                            added = true; break;
                        }
                    }
                    if (!added) {
                        clusters.push({ 
                            name: loc.city.toUpperCase(), state: loc.state.toUpperCase(), votes: loc.votes, 
                            lat: loc.lat, lng: loc.lng 
                        });
                    }
                });

                clusters.sort((a, b) => b.votes - a.votes);
                currentClusters = clusters;
                
                window.bubbleColorScale = d3.scaleLinear()
                    .domain([1, Math.max(...clusters.map(n => n.votes), 1)])
                    .range(["#1a1a4d", "#7ca6ff"]);

                // LEADERBOARD UI UPDATE
                const listEl = document.getElementById('leaderboard-list');
                if (listEl) {
                    const top10 = clusters.slice(0, 10);
                    listEl.innerHTML = ''; 
                    
                    if (top10.length === 0) {
                        listEl.innerHTML = '<li class="leaderboard-item" style="justify-content: center; border: none;">No votes yet! Be the first.</li>';
                    } else {
                        top10.forEach((cluster, index) => {
                            const li = document.createElement('li');
                            li.className = 'leaderboard-item';
                            li.innerHTML = `
                                <span class="leaderboard-rank">#${index + 1}</span>
                                <span class="leaderboard-city">${cluster.name}, ${cluster.state}</span>
                                <span class="leaderboard-votes">${cluster.votes}</span>
                            `;
                            listEl.appendChild(li);
                        });
                    }
                }
            });
        }

        async function triggerJackpot(city, votes, lat, lng, isNewCity) {
            isJackpotPlaying = true; 
            const layer = document.getElementById('jackpot-layer');
            const mapInner = document.getElementById('dynamic-map');
            const coords = projection([lng, lat]);
            const targetColor = window.bubbleColorScale ? window.bubbleColorScale(votes) : "#1a1a4d";
            
            if (window.innerWidth <= 700 && coords) {
                const instanceWidth = mapInner.offsetWidth;
                const intrinsicCityX = (coords[0] / width) * instanceWidth;
                let targetPan = (window.innerWidth / 2) - intrinsicCityX;
                while (targetPan > 0) targetPan -= instanceWidth;
                while (targetPan <= -instanceWidth) targetPan += instanceWidth;
                let diff = targetPan - currentPan;
                if (diff > instanceWidth / 2) targetPan -= instanceWidth; if (diff < -instanceWidth / 2) targetPan += instanceWidth;
                jackpotStartPan = currentPan; jackpotTargetPan = targetPan; jackpotPanStartTime = performance.now(); isJackpotPanning = true;
            }

            const bigB = document.createElement('div');
            bigB.className = 'anim-bubble';
            bigB.style.left = '50%'; bigB.style.top = '50%';
            bigB.style.backgroundColor = targetColor; bigB.style.color = '#FFFFFF'; bigB.style.borderColor = '#FFFFFF'; bigB.style.borderWidth = '6px';
            bigB.innerHTML = `<div class="v-big">${votes}</div><div class="c-big">${city}</div>`;
            layer.appendChild(bigB);
            
            play8Bit('spawn');
            requestAnimationFrame(() => bigB.classList.add('show'));

            document.querySelectorAll('.link-button').forEach(btn => {
                btn.classList.add('jackpot-pulse');
                setTimeout(() => btn.classList.remove('jackpot-pulse'), 600);
            });

            setTimeout(() => {
                const mapRect = mapInner.getBoundingClientRect();
                if (coords) {
                    let destX = mapRect.left + (coords[0] / width) * mapRect.width; 
                    if (window.innerWidth <= 700) { while (destX < -50) destX += mapRect.width; while (destX > window.innerWidth + 50) destX -= mapRect.width; }
                    const destY = mapRect.top + ((coords[1]-50) / height) * mapRect.height;
                    
                    let targetSize = 58;
                    let vFontSize = '16px';
                    let cFontSize = '8px';
                    
                    if (votes <= 10) { targetSize = 29; vFontSize = '10px'; cFontSize = '5px'; } 
                    else if (votes <= 25) { targetSize = 43.5; vFontSize = '12px'; cFontSize = '6px'; }

                    bigB.style.width = targetSize + 'px'; 
                    bigB.style.height = targetSize + 'px';
                    bigB.style.left = destX + 'px'; 
                    bigB.style.top = destY + 'px';
                    bigB.style.borderWidth = '2px'; 
                    bigB.style.boxShadow = '0 4px 12px rgba(0,0,0,0.6)';
                    bigB.querySelector('.v-big').style.fontSize = vFontSize;
                    bigB.querySelector('.c-big').style.fontSize = cFontSize;
                    bigB.querySelector('.c-big').style.marginTop = '0px';
                }
            }, 1000); 

            setTimeout(() => {
                play8Bit('settle');
                
                const confetti = document.createElement('img');
                confetti.src = 'confetti.gif?a=' + Math.random(); 
                confetti.style.position = 'fixed';
                confetti.style.left = bigB.style.left;
                confetti.style.top = bigB.style.top;
                confetti.style.width = '300px'; 
                confetti.style.height = '300px';
                confetti.style.transform = 'translate(-50%, -50%)';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '9999'; 
                confetti.style.transition = 'opacity 1s ease';
                layer.appendChild(confetti);

                bigB.style.opacity = '0';
                pendingJackpotUpdate.city = null;
                
                setTimeout(() => { confetti.style.opacity = '0'; setTimeout(() => { confetti.remove(); }, 1000); }, 1500);
                setTimeout(() => { bigB.remove(); isJackpotPlaying = false; }, 500);
            }, 1800); 
        }

        // 2. VOTE FORM PROCESSING (BREVO + MAKE WEBHOOK + FIREBASE)
        document.getElementById('tour-vote-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-button');
            submitBtn.disabled = true; submitBtn.innerText = "WAIT...";
            
            try {
                const cityInput = e.target.city.value.trim();
                const state = e.target.state.value.trim().toUpperCase();
                const firstname = e.target.firstname.value.trim();
                const lastname = e.target.lastname.value.trim();
                const email = e.target.email.value.trim().toLowerCase();
                const emailId = email.replace(/[^a-z0-9]/g, '');
                const locationId = `${cityInput.toLowerCase().replace(/[^a-z]/g, '')}_${state.toLowerCase().replace(/[^a-z]/g, '')}`;

                const emailSnap = await get(ref(db, `signups/${emailId}`));
                if (emailSnap.exists()) {
                    submitBtn.innerText = "ALREADY SIGNED UP!"; submitBtn.classList.add('error');
                    setTimeout(() => { submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; submitBtn.classList.remove('error'); }, 4000); return;
                }
                
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityInput)}&state=${encodeURIComponent(state)}&country=USA&format=json`);
                const geoData = await geoRes.json();
                if (!geoData || geoData.length === 0) { alert("City not found! Check spelling."); submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; return; }
                
                const lat = parseFloat(geoData[0].lat), lng = parseFloat(geoData[0].lon);
                document.querySelector('.impossibles-map-wrapper').scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // POST TO BREVO SUBSCRIBER ENDPOINT
                const brevoData = new FormData();
                brevoData.append('EMAIL', email);
                brevoData.append('FIRSTNAME', firstname);
                brevoData.append('LASTNAME', lastname);
                brevoData.append('CITY', cityInput);
                brevoData.append('STATE', state);
                brevoData.append('locale', 'en');
                brevoData.append('email_address_check', '');

                fetch('https://4d863324.sibforms.com/serve/MUIFANR4AGJhFT0wEsFWTwpziy-tQojRt9vEyxtX39KdSrMhgcIHeKCXPTXYba-zaJS7MVoIMQc74hKS_1vxdIQqVWPXMBMaYftppTZw2CPtx9vxzLxz2O6gPo8ysMxPeNt92ctrXS7b30fS9p_05xKmmTk0qoImULMwbrwSoStuKbPhx5LudJ5lobJv2v3B0121ejhMl7ktRc46nQ==', {
                    method: 'POST',
                    body: brevoData,
                    mode: 'no-cors'
                }).catch(err => console.error('Brevo sync:', err));

                // POST TO MAKE.COM WEBHOOK
                await fetch("https://hook.us2.make.com/kaxkanr8vi1tj4nywptgio127hfr3bds", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, firstname, lastname, city: cityInput, state })
                });

                // RECORD SIGNUP IN FIREBASE
                await set(ref(db, `signups/${emailId}`), { timestamp: Date.now() });

                let finalVotes = 1, oldVotes = 0, isNewCity = true, destLat = lat, destLng = lng, displayCity = cityInput;
                
                for (let cluster of currentClusters) {
                    if (getDistance(lat, lng, cluster.lat, cluster.lng) <= 115) {
                        oldVotes = cluster.votes; 
                        finalVotes = oldVotes + 1; 
                        isNewCity = false; 
                        destLat = cluster.lat; 
                        destLng = cluster.lng; 
                        displayCity = cluster.name; 
                        break;
                    }
                }
                
                pendingJackpotUpdate = { city: displayCity.toLowerCase(), oldVotes: oldVotes };
                const locRef = ref(db, `locations/${locationId}`);
                const snap = await get(locRef);
                if (snap.exists()) { await update(ref(db, 'locations'), { [`${locationId}/votes`]: increment(1) }); }
                else { await set(locRef, { city: cityInput, state, lat, lng, votes: 1 }); }

                triggerJackpot(displayCity, finalVotes, destLat, destLng, isNewCity);
                e.target.reset(); submitBtn.innerText = "SUCCESS!";
                setTimeout(() => { submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; }, 3000);
            } catch (err) { console.error(err); submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; }
        });
    </script>
