<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, we’re the Impossibles from Austin, Texas!</title>
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <script>
      (function (s, e, n, d, er) {

    <style>
        body {
            background-image: url('THEIMPOSSIBLES_Midwest2026_REGGIES_BG.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; overflow-x: hidden;
        }

        /* --- ANIMATIONS --- */
        .animate-on-load { opacity: 0; animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

        .hero-logo-container { width: 100%; max-width: 1000px; margin-bottom: 30px; text-align: center; }
        .full-width-logo { width: 100%; height: auto; max-height: 300px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); }

        /* MAP AREA */
        .impossibles-map-wrapper { position: relative; width: 100%; max-width: 1000px; margin-bottom: 40px; }
        .map-instance { width: 100%; position: relative; aspect-ratio: 975 / 610; }
        .map-instance svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .state-path { fill: #111122; stroke: #333355; stroke-width: 1px; }
        .tour-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }
        .connector-line { stroke: #ff0055; stroke-width: 2px; stroke-dasharray: 4; opacity: 0.6; }

        /* TOUR BUTTONS */
        .tour-pin {
            position: absolute; background: #000033; color: #ffffff;
            font-family: 'Impact', 'Arial Black', sans-serif; padding: 12px;
            border: 2px solid #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            border-radius: 8px; text-align: center; cursor: pointer;
            pointer-events: auto; transition: all 0.2s; white-space: nowrap;
        }
        .tour-pin:hover { background: #ff0055; transform: scale(1.05); }
        .pin-date { font-size: 14px; display: block; }
        .pin-city { font-size: 18px; display: block; margin: 4px 0; text-transform: uppercase; }
        .pin-tix { font-size: 12px; background: #ffffff; color: #000033; border-radius: 4px; padding: 2px 8px; }

        /* REST OF UI */
        .leaderboard-wrapper { width: 100%; max-width: 600px; background-color: rgba(0, 0, 51, 0.85); border: 2px solid #FFFFFF; border-radius: 15px; padding: 25px; margin-bottom: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .leaderboard-title { color: #FFFFFF; font-family: 'Impact', sans-serif; font-size: 28px; text-align: center; text-transform: uppercase; margin: 0; }
        .leaderboard-list { list-style: none; padding: 0; margin-top: 20px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; color: white; font-weight: bold; }
        
        .impossibles-form-wrapper { width: 100%; max-width: 600px; margin: 0 auto 40px; }
        .impossibles-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .field-container { flex: 1; min-width: 200px; margin-bottom: 20px; }
        .impossibles-input { width: 100%; padding: 10px 0; background: transparent; border: none; border-bottom: 1px solid #555; color: white; font-size: 18px; }
        .impossibles-submit-btn { width: 100%; padding: 15px; background: white; border: none; border-radius: 30px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        
        .link-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .link-button { background: #000033; color: white; border: 2px solid white; border-radius: 30px; padding: 10px; text-align: center; text-transform: uppercase; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="hero-logo-container animate-on-load">
        <img src="impossibles_logo.png" alt="The Impossibles" class="full-width-logo">
    </div>

    <div class="impossibles-map-wrapper animate-on-load delay-1">
        <div class="map-instance" id="map-container"></div>
    </div>

    <div class="leaderboard-wrapper animate-on-load delay-2">
        <h2 class="leaderboard-title">Live Standings</h2>
        <ul id="leaderboard-list" class="leaderboard-list"></ul>
    </div>

    <div class="impossibles-form-wrapper animate-on-load delay-3">
        <form id="tour-vote-form">
            <div class="impossibles-grid">
                <div class="field-container"><input type="text" name="city" placeholder="City" class="impossibles-input" required></div>
                <div class="field-container"><input type="text" name="state" placeholder="State" class="impossibles-input" required></div>
            </div>
            <button type="submit" id="submit-button" class="impossibles-submit-btn">Vote for your city</button>
        </form>
    </div>

    <div class="link-grid animate-on-load delay-4">
        <a href="#" class="link-button">Spotify</a>
        <a href="#" class="link-button">Apple Music</a>
        <a href="#" class="link-button">YouTube</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, update, increment } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // TOUR DATA
        const confirmedShows = [
            { date: "AUG 21", city: "St. Louis, MO", lng: -90.1994, lat: 38.6270, url: "#" },
            { date: "AUG 22", city: "Chicago, IL", lng: -87.6298, lat: 41.8781, url: "#" },
            { date: "AUG 23", city: "Detroit, MI", lng: -83.0458, lat: 42.3314, url: "#" }
        ];

        // MAP PHYSICS FOR BUTTONS
        const width = 975, height = 610;
        const projection = d3.geoAlbersUsa().scale(1300).translate([width/2, height/2]);
        const svg = d3.select("#map-container").append("svg").attr("viewBox", [0, 0, width, height]);
        const tourLayer = d3.select("#map-container").append("div").attr("class", "tour-layer");

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
            svg.append("g").selectAll("path").data(topojson.feature(us, us.objects.states).features).join("path").attr("class", "state-path").attr("d", d3.geoPath().projection(projection));

            const nodes = confirmedShows.map(d => ({
                ...d,
                anchor: projection([d.lng, d.lat]),
                x: projection([d.lng, d.lat])[0],
                y: projection([d.lng, d.lat])[1]
            }));

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink().id(d => d.city).distance(0))
                .force("charge", d3.forceManyBody().strength(-100))
                .force("collide", d3.forceCollide().radius(50))
                .force("x", d3.forceX(d => d.anchor[0]).strength(0.1))
                .force("y", d3.forceY(d => d.anchor[1]).strength(0.1));

            const lines = svg.append("g").selectAll("line").data(nodes).join("line").attr("class", "connector-line");
            const pins = tourLayer.selectAll(".tour-pin").data(nodes).join("div")
                .attr("class", "tour-pin")
                .html(d => `<span class="pin-date">${d.date}</span><span class="pin-city">${d.city.split(',')[0]}</span><span class="pin-tix">TICKETS</span>`)
                .on("click", (e, d) => window.open(d.url, '_blank'));

            simulation.on("tick", () => {
                pins.style("left", d => `${d.x}px`).style("top", d => `${d.y}px`);
                lines.attr("x1", d => d.x).attr("y1", d => d.y).attr("x2", d => d.anchor[0]).attr("y2", d => d.anchor[1]);
            });
        });

        // LEADERBOARD LOGIC
        onValue(ref(db, 'locations'), (snapshot) => {
            const data = snapshot.val(); if (!data) return;
            const clusters = [];
            Object.values(data).sort((a,b) => b.votes - a.votes).forEach(loc => {
                let added = false;
                for (let c of clusters) {
                    if (getDistance(loc.lat, loc.lng, c.lat, c.lng) <= 115) { c.votes += loc.votes; added = true; break; }
                }
                if (!added) clusters.push({ name: loc.city.toUpperCase(), state: loc.state.toUpperCase(), votes: loc.votes, lat: loc.lat, lng: loc.lng });
            });
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = clusters.sort((a,b) => b.votes - a.votes).slice(0, 10).map((c, i) => `<li class="leaderboard-item"><span>#${i+1} ${c.name}, ${c.state}</span><span>${c.votes}</span></li>`).join('');
        });
    </script>
</body>
</html>
