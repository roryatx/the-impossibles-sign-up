    <style>
        body {
            background-image: url('THEIMPOSSIBLES_Midwest2026_REGGIES_BG.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; overflow-x: hidden;
        }

        /* --- FANCY PREMIUM LOADING ANIMATIONS --- */
        .animate-on-load {
            opacity: 0; transform: translateY(30px);
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* BUTTONS */
        .link-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 850px; margin-bottom: 40px; }
        .link-button {
            background-color: #000033; color: #FFFFFF; border: 2px solid #FFFFFF; border-radius: 40px;
            padding: 6px 20px 6px 8px; text-decoration: none; text-transform: uppercase;
            font-weight: 900; font-size: 16px; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: flex-start; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }
        .status-bubble {
            background-color: #FFFFFF; color: #000033; padding: 8px 18px; border-radius: 25px;
            font-size: 12px; font-weight: 900; margin-right: 15px; min-width: 70px; text-align: center;
            position: relative; z-index: 2;
        }
        .link-button:hover { background-color: #1a1a4d; transform: scale(1.02); }
        .link-button::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: sweepSheen 6s infinite; pointer-events: none; z-index: 1;
        }
        @keyframes sweepSheen { 0% { left: -150%; } 20% { left: 200%; } 100% { left: 200%; } }
        @media (max-width: 700px) { .link-grid { grid-template-columns: 1fr; } }

        /* LEADERBOARD & TEXT STYLING */
        .text-block-wrapper { width: 100%; max-width: 600px; margin-bottom: 40px; }
        .big-impact { 
            font-family: 'Impact', 'Arial Black', sans-serif; font-size: clamp(24px, 6vw, 48px);
            text-align: center; color: #FFFFFF; text-transform: uppercase; line-height: 1; margin: 0;
        }
        .sub-impact { 
            font-family: 'Impact', 'Arial Black', sans-serif; font-size: clamp(14px, 3vw, 20px);
            text-align: justify; color: #7ca6ff; text-transform: uppercase; margin: 0;
            display: flex; justify-content: space-between;
        }
        /* Justify hack: ensures text stretches to match width of container */
        .sub-impact::after { content: ''; width: 100%; }

        .leaderboard-wrapper {
            width: 100%; max-width: 600px; background-color: rgba(0, 0, 51, 0.85);
            border: 2px solid #FFFFFF; border-radius: 15px; padding: 25px;
            margin-bottom: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            box-sizing: border-box; position: relative; overflow: hidden;
        }
        .leaderboard-wrapper::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: sweepSheen 8s infinite 1s; pointer-events: none; z-index: 10;
        }
        .leaderboard-list { list-style: none; padding: 0; margin: 20px 0 0 0; }
        .leaderboard-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.2);
            color: #FFFFFF; font-weight: bold; font-size: 16px; text-transform: uppercase;
        }
        .leaderboard-rank { width: 30px; color: #7ca6ff; }
        .leaderboard-city { flex-grow: 1; text-align: left; }
        .leaderboard-votes { background-color: #FFFFFF; color: #000033; padding: 4px 12px; border-radius: 15px; font-size: 14px; font-weight: 900; }

        .embed-wrapper { width: 100%; max-width: 600px; margin: 0 auto 60px auto; min-height: 300px; display: flex; justify-content: center; }

<body>

    <div class="hero-logo-container animate-on-load">

    <!-- LINK GRID -->

    <!-- UPDATED LEADERBOARD -->

        </div>
        <ul id="leaderboard-list" class="leaderboard-list">
            <li class="leaderboard-item" style="justify-content: center; border: none;">LOADING LIVE STANDINGS...</li>
        </ul>
    </div>

    <!-- UPDATED SIGNUP -->
    <div class="text-block-wrapper animate-on-load delay-3" style="margin-bottom: 30px;">
        <h1 class="big-impact">SIGN UP</h1>
        <div class="sub-impact" style="color: #FFFFFF;"><span>BE THE FIRST</span> <span>TO KNOW!</span></div>
    </div>

    <div class="embed-wrapper">
        <div class="sender-form-field" data-sender-form-id="e5yGGY" style="width: 100%; max-width: 380px;"></div>
    </div>

    <!-- SCRIPT SECTION (REMAINS THE SAME) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const listEl = document.getElementById('leaderboard-list');
        onValue(ref(db, 'locations'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                const sortedLocations = Object.values(data).sort((a, b) => b.votes - a.votes).slice(0, 10);
                listEl.innerHTML = ''; 
                sortedLocations.forEach((loc, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `<span class="leaderboard-rank">#${index + 1}</span><span class="leaderboard-city">${loc.city}, ${loc.state}</span><span class="leaderboard-votes">${loc.votes}</span>`;
                    listEl.appendChild(li);
                });
            }
        });

        document.addEventListener('click', async (e) => {
            const submitBtn = e.target.closest('button[type="submit"], input[type="submit"]'); 
            if (submitBtn && submitBtn.closest('.sender-form-field')) {
                const form = submitBtn.closest('form');
                if (!form) return;
                let city = '', state = '';
                form.querySelectorAll('input').forEach(input => {
                    const attrStr = `${input.name} ${input.placeholder} ${input.className}`.toLowerCase();
                    if (attrStr.includes('city')) city = input.value;
                    if (attrStr.includes('state')) state = input.value;
                });
                if (city && state) {
                    const locationId = `${city.trim().toLowerCase().replace(/[^a-z]/g, '')}_${state.trim().toUpperCase().toLowerCase().replace(/[^a-z]/g, '')}`;
                    try {
                        const locRef = ref(db, `locations/${locationId}`);
                        const snap = await get(locRef);
                        if (snap.exists()) { await update(ref(db, 'locations'), { [`${locationId}/votes`]: increment(1) }); }
                        else { await set(locRef, { city: city.trim(), state: state.trim().toUpperCase(), votes: 1 }); }
                    } catch (err) { console.error(err); }
                }
            }
        }, true); 
    </script>
</body>
