    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, update, increment } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUDBMlQIsRehOQFRqyoAKlWElWjox4ZOo",
            authDomain: "the-impossibles-sign-up.firebaseapp.com",
            databaseURL: "https://the-impossibles-sign-up-default-rtdb.firebaseio.com",
            projectId: "the-impossibles-sign-up",
            storageBucket: "the-impossibles-sign-up.firebasestorage.app",
            messagingSenderId: "1060998426448",
            appId: "1:1060998426448:web:d6e8da85edbc9cb6fa8655"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const width = 975, height = 610;
        const projection = d3.geoAlbersUsa().scale(1300).translate([width / 2, height / 2]);
        const path = d3.geoPath().projection(projection);

        // Confirmed Gig Locations mapping cleanly to top actions
        const confirmedShows = [
            { date: "AUG 21", city: "St. Louis, MO", lng: -90.1994, lat: 38.6270, url: "https://www.etix.com/ticket/p/32114610/the-impossibles-stlouis-blueberry-hill-duck-room" },
            { date: "AUG 22", city: "Chicago, IL", lng: -87.6298, lat: 41.8781, url: "https://www.ticketweb.com/event/the-impossibles-space-monkey-mafia-reggies-rock-club-tickets/14894673" },
            { date: "AUG 23", city: "Detroit, MI", lng: -83.0458, lat: 42.3314, url: "https://www.ticketweb.com/event/magic-bag-presents-the-impossibles-the-magic-bag-tickets/14818043?pl=magicbag" },
            { date: "SEP 12", city: "Supernova, VA", lng: -76.3094, lat: 37.0024, url: "https://www.tixr.com/groups/supernovaska/events/supernovaska-2026-supernova-international-ska-festival-158685" },
            { date: "OCT 23-25", city: "The Fest, FL", lng: -82.3248, lat: 29.6516, url: "https://thefestfl.com/ticket-info/" }
        ];
        
        let currentPan = 0, isDragging = false, startX = 0;
        let touchVelocity = 0, lastTouchX = 0, isInertia = false;
        const autoPanSpeed = 0.5;

        function panLoop() {
            if (window.innerWidth <= 700) {
                if (!isDragging) {
                    if (isInertia) {
                        currentPan += touchVelocity;
                        touchVelocity *= 0.95; 
                        if (Math.abs(touchVelocity) < 0.2) isInertia = false;
                    } else {
                        currentPan -= autoPanSpeed; 
                    }
                }
                
                const track = document.getElementById('map-track');
                const instanceWidth = document.getElementById('dynamic-map').offsetWidth;

                if (currentPan <= -instanceWidth) currentPan += instanceWidth;
                if (currentPan > 0) currentPan -= instanceWidth;
                
                track.style.transform = `translate3d(${currentPan}px, 0, 0)`;
            } else {
                document.getElementById('map-track').style.transform = `translate3d(0, 0, 0)`;
            }
            requestAnimationFrame(panLoop);
        }
        panLoop();

        const track = document.getElementById('map-track');
        track.addEventListener('touchstart', (e) => {
            if (window.innerWidth > 700) return;
            isDragging = true; isInertia = false; touchVelocity = 0; lastTouchX = e.touches[0].clientX; startX = e.touches[0].clientX - currentPan;
        });
        track.addEventListener('touchmove', (e) => {
            if (window.innerWidth > 700 || !isDragging) return;
            const currentTouchX = e.touches[0].clientX; touchVelocity = currentTouchX - lastTouchX; lastTouchX = currentTouchX; currentPan = currentTouchX - startX;
        }, { passive: true });
        track.addEventListener('touchend', () => { isDragging = false; if (Math.abs(touchVelocity) > 0.5) isInertia = true; });

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 3958.8; // Radius in miles
            const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(function(us) {
            const mapSvg = d3.select("#dynamic-map").append("svg").attr("viewBox", [0, 0, width, height]);
            mapSvg.append("g").selectAll("path").data(topojson.feature(us, us.objects.states).features).join("path").attr("class", "state-path").attr("d", path);
            
            labelsLayer = d3.select("#dynamic-map").append("div").attr("class", "labels-layer");
            
            // Plot Status Tour Stop Pins into dynamic DOM overlay
            confirmedShows.forEach(show => {
                const coords = projection([show.lng, show.lat]);
                if (coords) {
                    const pinWrapper = labelsLayer.append("div")
                        .attr("class", "tour-pin-wrapper")
                        .style("left", `${(coords[0] / width) * 100}%`)
                        .style("top", `${(coords[1] / height) * 100}%`);
                        
                    const pin = pinWrapper.append("div")
                        .attr("class", "tour-pin")
                        .on("click", () => window.open(show.url, '_blank'));
                        
                    pin.append("div").attr("class", "tour-pin-date").text(show.date);
                    pin.append("div").attr("class", "tour-pin-city").text(show.city.split(',')[0]);
                }
            });

            if (window.innerWidth <= 700) { 
                document.getElementById('map-clone').innerHTML = document.getElementById('dynamic-map').innerHTML; 
            }
            listenToDatabase();
        });

        // 1. POPULATE LEADERBOARD IN REAL-TIME
        function listenToDatabase() {
            onValue(ref(db, 'locations'), (snapshot) => {
                const data = snapshot.val(); if (!data) return;
                
                // Sort raw locations by vote count descending so the top performer lays down anchor hubs first
                const rawLocations = Object.values(data).sort((a, b) => b.votes - a.votes);
                const clusters = [];

                rawLocations.forEach(loc => {
                    let added = false;
                    for (let cluster of clusters) {
                        // 115 Miles broad cluster radius (~2 hour drive baseline requirement)
                        if (getDistance(loc.lat, loc.lng, cluster.lat, cluster.lng) <= 115) {
                            cluster.votes += loc.votes;
                            added = true; break;
                        }
                    }
                    if (!added) {
                        clusters.push({ 
                            name: loc.city.toUpperCase(), 
                            state: loc.state.toUpperCase(), 
                            votes: loc.votes, 
                            lat: loc.lat, 
                            lng: loc.lng 
                        });
                    }
                });

                // Final cluster sort reflecting complete merged configurations
                clusters.sort((a, b) => b.votes - a.votes);

                const listEl = document.getElementById('leaderboard-list');
                if (listEl) {
                    listEl.innerHTML = ''; 
                    const top10 = clusters.slice(0, 10);
                    
                    if (top10.length === 0) {
                        listEl.innerHTML = '<li class="leaderboard-item" style="justify-content: center; border: none;">No signups yet!</li>';
                    } else {
                        top10.forEach((cluster, index) => {
                            const li = document.createElement('li');
                            li.className = 'leaderboard-item';
                            li.innerHTML = `
                                <span class="leaderboard-rank">#${index + 1}</span>
                                <span class="leaderboard-city">${cluster.name}, ${cluster.state}</span>
                                <span class="leaderboard-votes">${cluster.votes}</span>
                            `;
                            listEl.appendChild(li);
                        });
                    }
                }
            });
        }

        // 2. PROCESS VOTE FORM AND UPDATE FIREBASE
        document.getElementById('tour-vote-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-button');
            submitBtn.disabled = true; submitBtn.innerText = "WAIT...";
            try {
                const cityInput = e.target.city.value.trim();
                const state = e.target.state.value.trim().toUpperCase();
                const email = e.target.email.value.trim().toLowerCase();
                const emailId = email.replace(/[^a-z0-9]/g, '');
                const locationId = `${cityInput.toLowerCase().replace(/[^a-z]/g, '')}_${state.toLowerCase().replace(/[^a-z]/g, '')}`;

                // Anti-spam / Duplicate Check
                const emailSnap = await get(ref(db, `signups/${emailId}`));
                if (emailSnap.exists()) {
                    submitBtn.innerText = "ALREADY SIGNED UP!"; submitBtn.classList.add('error');
                    setTimeout(() => { submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; submitBtn.classList.remove('error'); }, 4000); return;
                }
                
                // Fetch Geolocation via OSM
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityInput)}&state=${encodeURIComponent(state)}&country=USA&format=json&extratags=1`);
                const geoData = await geoRes.json();
                if (!geoData || geoData.length === 0) { alert("City not found! Check spelling."); submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; return; }
                
                const lat = parseFloat(geoData[0].lat), lng = parseFloat(geoData[0].lon);
                
                let population = 0;
                if (geoData[0].extratags && geoData[0].extratags.population) {
                    population = parseInt(geoData[0].extratags.population, 10);
                }
                
                // Webhook Push to Make.com
                await fetch("https://hook.us2.make.com/kaxkanr8vi1tj4nywptgio127hfr3bds", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, firstname: e.target.firstname.value, lastname: e.target.lastname.value, city: cityInput, state })
                });
                
                // Log User as Signed Up
                await set(ref(db, `signups/${emailId}`), { timestamp: Date.now() });

                // Process the Location Vote
                const locRef = ref(db, `locations/${locationId}`);
                const snap = await get(locRef);
                if (snap.exists()) { 
                    await update(ref(db, 'locations'), { [`${locationId}/votes`]: increment(1) }); 
                } else { 
                    await set(locRef, { city: cityInput, state, lat, lng, votes: 1, population }); 
                }

                // Success State Reset
                e.target.reset(); submitBtn.innerText = "SUCCESS!";
                setTimeout(() => { submitBtn.disabled = false; submitBtn.innerText = "SIGN UP"; }, 3000);
            } catch (err) { 
                console.error(err); 
                submitBtn.disabled = false; 
                submitBtn.innerText = "SIGN UP"; 
            }
        });
    </script>
</body>
</html>
